name: test

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    # macOS only: sweep targets macOS and the tests check APFS behaviour.
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
      - run: make test
