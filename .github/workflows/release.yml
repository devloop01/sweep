name: release

# Push a tag like v0.4.0 to publish a release. A tag with a "-" (v0.4.0-rc.1)
# becomes a pre-release, which install.sh and `go install @latest` ignore.
on:
  push:
    tags: ["v*"]

permissions:
  contents: write # create the release
  id-token: write # sign the build attestation
  attestations: write

jobs:
  release:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0 # make release reads the version from the tag
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      - run: make test
      - name: Build
        run: |
          make release
          test "$(dist/sweep-darwin-arm64 --version)" = "$GITHUB_REF_NAME"
          (cd dist && shasum -a 256 sweep-darwin-arm64 > SHA256SUMS)
      - uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: dist/sweep-darwin-arm64
      - name: Write release notes
        # Commit subjects since the last final release (pre-releases skipped).
        run: |
          prev=$(git describe --tags --abbrev=0 --exclude='*-*' "$GITHUB_REF_NAME^" 2>/dev/null || true)
          {
            echo "## Changes"
            echo
            git log --no-merges --format='- %s' ${prev:+"$prev.."}"$GITHUB_REF_NAME"
            echo
            echo "## Install"
            echo
            echo '```sh'
            echo "curl -fsSL https://raw.githubusercontent.com/$GITHUB_REPOSITORY/main/install.sh | sh"
            echo "# or: go install github.com/$GITHUB_REPOSITORY@$GITHUB_REF_NAME"
            echo '```'
            if [ -n "$prev" ]; then
              echo
              echo "**Full changelog:** https://github.com/$GITHUB_REPOSITORY/compare/$prev...$GITHUB_REF_NAME"
            fi
          } > dist/notes.md
      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          pre=""
          [[ "$GITHUB_REF_NAME" == *-* ]] && pre=--prerelease
          gh release create "$GITHUB_REF_NAME" --verify-tag --notes-file dist/notes.md $pre \
            dist/sweep-darwin-arm64 dist/SHA256SUMS
