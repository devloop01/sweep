# Folders sweep deletes by default. One exact folder name per line
# (case-sensitive), or parent/child to delete only child inside parent.
# Lines starting with # are comments.
#
# To change this, create ~/.config/sweep/targets.conf in the same format.
# Names there are added to this list; put ! in front of a name to stop
# deleting it, e.g. !.output
#
# Everything here comes back with npm/pnpm install or the next dev/build run.

node_modules
.svelte-kit
.turbo
.next
.nuxt
.output
.astro
.vite
.parcel-cache
.angular
.docusaurus
.nx
.vinxi
storybook-static

# Build output. Deleted only in a git repo where git confirms nothing inside
# is tracked; outside git these names can hold real files (a downloaded
# library's build scripts, a committed dist/), so they're kept.
dist
build
out

# Only Vercel's build output; the rest of .vercel (the project link) is kept.
.vercel/output
