# sweep's built-in target lists. sweep deletes folders with exactly these
# names (case-sensitive).
#
# To customise, create ~/.config/sweep/targets.conf in this format. Names
# you list there are added to these lists; a line like !.output removes a
# name from them.
#
# One folder name per line. No paths, wildcards or spaces. Lines starting
# with # are comments.

# Always deleted. Regenerated by npm/pnpm install or the next dev/build run.
[default]
node_modules
.svelte-kit
.turbo
.next
.nuxt
.output
.astro
.vite
.parcel-cache
.angular
.docusaurus
.nx
.vinxi
storybook-static

# Always deleted: only this subfolder goes, the parent is kept.
# Written as parent/child. .vercel/output is Vercel build output;
# .vercel/project.json survives.
[nested]
.vercel/output

# Only with --build. Opt-in because some projects commit these or keep real
# files in them.
[build]
dist
build
out

# Only with --deploy. Not pure cache: .vercel and .netlify hold the project
# link (run `vercel link` again), and .wrangler/state holds local
# D1/KV/R2/Durable Objects dev data, which is lost.
[deploy]
.vercel
.netlify
.wrangler
