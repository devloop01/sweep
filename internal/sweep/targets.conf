# Folders sweep deletes by default. One exact folder name per line
# (case-sensitive), or parent/child to delete only child inside parent.
# Lines starting with # are comments.
#
# To change this, create ~/.config/sweep/targets.conf in the same format.
# Names there are added to this list; put ! in front of a name to stop
# deleting it, e.g. !.output
#
# Everything here comes back with npm/pnpm install, or the next dev, build,
# cargo or test run.

node_modules
.svelte-kit
.turbo
.next
.nuxt
.output
.astro
.vite
.parcel-cache
.angular
.docusaurus
.nx
.vinxi
storybook-static

# Python tool caches. __pycache__ is left out: there's one in nearly every
# folder (thousands in a virtualenv), each tiny.
.pytest_cache
.mypy_cache
.ruff_cache

# Build output. Deleted only in a git repo whose ignore rules name the
# folder (dist/, /build, **/target), with nothing in it tracked. Otherwise
# these names can hold real files (a downloaded library's build scripts, a
# committed dist/, new files not committed yet), so they're kept. target is
# Cargo's (Rust) and Maven's build folder.
dist
build
out
target

# Only Vercel's build output; the rest of .vercel (the project link) is kept.
.vercel/output
